name: Deploy production

on:
  push:
    branches:
      - master
    paths-ignore:
      - .github/workflows/deploy-production.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy admin API
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "flock -w 1200 /home/abdallah/.production-deploy.lock bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd /home/abdallah/apps/isc-admin-api

          git fetch origin master
          git merge --ff-only origin/master
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)"

          docker compose -f docker-compose.prod.yml exec -T laravel-app \
            php artisan optimize:clear
          docker compose -f docker-compose.prod.yml exec -T laravel-app \
            php artisan migrate --force
          docker compose -f docker-compose.prod.yml exec -T laravel-app \
            php artisan config:cache
          docker compose -f docker-compose.prod.yml exec -T laravel-app \
            php artisan route:cache
          docker compose -f docker-compose.prod.yml exec -T laravel-app \
            php artisan view:cache

          docker compose -f docker-compose.prod.yml up -d --build laravel-app nginx
          docker compose -f docker-compose.prod.yml restart nginx

          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors \
            --max-time 20 https://api.avinaq.com/up > /dev/null
          REMOTE

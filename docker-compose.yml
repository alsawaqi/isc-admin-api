services:
  laravel-app:
    build:
      context: .
      dockerfile: docker/dev/php/php.dockerfile
    # user: "1000:1000" # your UID:GID
    volumes:
      - ./src:/var/www/html
      - ../shared-storage/public:/var/www/html/storage/app/public
      - ../shared-storage/private:/var/www/html/storage/app/private
    environment:
      FILESYSTEM_DISK: uploads
      UPLOADS_ROOT: /var/www/html/storage/app/public
      PRIVATE_UPLOADS_ROOT: /var/www/html/storage/app/private
      UPLOADS_URL: http://localhost:81/storage
    command: >
      sh -c "chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache && php-fpm"
    networks:
      - proxy_network

  nginx:
    image: nginx:latest
    ports:
      - "81:80"
    volumes:
      - ./src:/var/www/html
      - ../shared-storage/public:/var/www/html/storage/app/public:ro
      - ./docker/dev/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - proxy_network

  artisan:
    build:
      context: ./src
      dockerfile: ../docker/dev/artisan/artisan.dockerfile
    volumes:
      - ./src:/var/www/html
      - ../shared-storage/public:/var/www/html/storage/app/public
      - ../shared-storage/private:/var/www/html/storage/app/private
    environment:
      FILESYSTEM_DISK: uploads
      UPLOADS_ROOT: /var/www/html/storage/app/public
      PRIVATE_UPLOADS_ROOT: /var/www/html/storage/app/private
      UPLOADS_URL: http://localhost:81/storage
    networks:
      - proxy_network
    depends_on:
      - laravel-app


  # reverb:
  #   build:
  #     context: .
  #     dockerfile: docker/dev/php/php.dockerfile
  #   working_dir: /var/www/html
  #   command: php artisan reverb:start --host=0.0.0.0 --port=8080

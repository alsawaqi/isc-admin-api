  #   depends_on:
  #     - laravel-app
  #   networks:
  #     - proxy_network
  #   ports:
  #     - "8080:8080"


  composer:
    image: composer:latest
    container_name: composer
    volumes:
      - ./src:/app
    working_dir: /app
    command: install
    networks:
      - proxy_network

networks:
  proxy_network:
    external: true

volumes:
  mssql_data:

services:
  laravel-app:
    build:
      context: .
      dockerfile: docker/prod/php/php.dockerfile
    volumes:
      - ./src:/var/www/html:ro               # Read-only application code
      - storage-data:/var/www/html/storage   # Writable Laravel storage
      - uploads-public-data:/var/www/html/storage/app/public
      - uploads-private-data:/var/www/html/storage/app/private
      - cache-data:/var/www/html/bootstrap/cache  # Writable Laravel cache
    environment:
      APP_ENV: production
      APP_DEBUG: false
      FILESYSTEM_DISK: uploads
      UPLOADS_ROOT: /var/www/html/storage/app/public
      PRIVATE_UPLOADS_ROOT: /var/www/html/storage/app/private
      UPLOADS_URL: https://api.avinaq.com/storage
    networks:
      - proxy_network

  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./src:/var/www/html:ro
      - uploads-public-data:/var/www/html/storage/app/public:ro
      - ./docker/prod/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel-app
    networks:
      - proxy_network

  composer:
    build:
      context: .
      dockerfile: docker/prod/php/php.dockerfile
    volumes:
      - ./src:/var/www/html
    working_dir: /var/www/html
    entrypoint: ["composer"]
    networks:
      - proxy_network

  artisan:
    build:
      context: .
      dockerfile: docker/prod/artisan/artisan.dockerfile
    volumes:
      - ./src:/var/www/html
    working_dir: /var/www/html
    command: php artisan migrate --force
    depends_on:
      - laravel-app
    networks:
      - proxy_network

networks:
  proxy_network:
    external: true

volumes:
  uploads-public-data:
    name: isc_uploads_public
  uploads-private-data:
    name: isc_uploads_private
  storage-data:
  cache-data:
